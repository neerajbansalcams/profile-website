<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Thumbnail — Claude Agents Reference v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1200px;
      height: 627px;
      overflow: hidden;
      background: #0D0F14;
    }

    .canvas {
      position: relative;
      width: 1200px;
      height: 627px;
      background: #0D0F14;
      overflow: hidden;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Grain texture overlay ── */
    .canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 1;
    }

    /* ── Amber radial glow — top-right ── */
    .glow-tr {
      position: absolute;
      top: -180px;
      right: -100px;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245,166,35,0.13) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Amber radial glow — bottom-left ── */
    .glow-bl {
      position: absolute;
      bottom: -200px;
      left: -100px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245,166,35,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Dot grid ── */
    .dot-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(245,166,35,0.18) 1px, transparent 1px);
      background-size: 32px 32px;
      background-position: 16px 16px;
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Left side — stat column ── */
    .stat-col {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 280px;
      border-right: 1px solid rgba(245,166,35,0.15);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 40px;
      z-index: 2;
      background: linear-gradient(90deg, rgba(245,166,35,0.04) 0%, transparent 100%);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-item + .stat-item {
      margin-top: 36px;
      padding-top: 36px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .stat-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 64px;
      font-weight: 700;
      color: #F5A623;
      line-height: 1;
      letter-spacing: -2px;
    }

    .stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      color: #5C6480;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 6px;
    }

    /* ── Right side — editorial content ── */
    .editorial {
      position: absolute;
      left: 280px;
      top: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 60px 44px 56px;
      z-index: 2;
    }

    /* Top meta row */
    .meta-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .meta-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #0D0F14;
      background: #F5A623;
      padding: 4px 10px;
      border-radius: 2px;
    }

    .meta-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #5C6480;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .meta-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #5C6480;
      flex-shrink: 0;
    }

    /* Main headline block */
    .headline-block {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 16px 0;
    }

    .headline-pre {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: #F5A623;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .headline-pre::before {
      content: '';
      display: block;
      width: 32px;
      height: 1px;
      background: #F5A623;
      opacity: 0.6;
    }

    .headline-main {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 72px;
      font-weight: 900;
      line-height: 1.0;
      color: #F0F2F8;
      letter-spacing: -1px;
    }

    .headline-main em {
      color: #F5A623;
      font-style: italic;
      font-weight: 700;
    }

    .headline-sub {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 72px;
      font-weight: 400;
      font-style: italic;
      color: #9BA3BC;
      line-height: 1.0;
      letter-spacing: -1px;
    }

    .tagline {
      margin-top: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #5C6480;
      letter-spacing: 0.04em;
      line-height: 1.6;
    }

    .tagline strong {
      color: #9BA3BC;
      font-weight: 500;
    }

    /* Bottom row */
    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .author-block {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .author-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(245,166,35,0.12);
      border: 1px solid rgba(245,166,35,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #F5A623;
    }

    .author-info {}
    .author-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #F0F2F8;
      letter-spacing: 0.04em;
    }
    .author-url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #5C6480;
      letter-spacing: 0.06em;
    }

    .cta-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1px solid rgba(245,166,35,0.3);
      border-radius: 3px;
      background: rgba(245,166,35,0.06);
    }

    .cta-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #F5A623;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .cta-arrow {
      font-size: 14px;
      color: #F5A623;
    }

    /* ── Decorative vertical amber line — right edge ── */
    .deco-line-right {
      position: absolute;
      right: 48px;
      top: 60px;
      bottom: 60px;
      width: 1px;
      background: linear-gradient(180deg, transparent, rgba(245,166,35,0.2) 30%, rgba(245,166,35,0.2) 70%, transparent);
      z-index: 1;
    }

    /* ── Top amber rule ── */
    .rule-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, #F5A623 0%, #F5A623 280px, transparent 280px);
      z-index: 3;
    }

    /* ── Diagonal accent ── */
    .deco-diagonal {
      position: absolute;
      top: 80px;
      right: 200px;
      width: 160px;
      height: 1px;
      background: rgba(245,166,35,0.15);
      transform: rotate(-25deg);
      transform-origin: right center;
      z-index: 1;
    }

    /* ── NEW badge on stat col top ── */
    .col-header {
      position: absolute;
      top: 28px;
      left: 40px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #5C6480;
      z-index: 3;
    }
  </style>
</head>
<body>
  <div class="canvas">

    <!-- Atmospheric layers -->
    <div class="glow-tr"></div>
    <div class="glow-bl"></div>
    <div class="dot-grid"></div>
    <div class="rule-top"></div>
    <div class="deco-line-right"></div>
    <div class="deco-diagonal"></div>

    <!-- Left stat column -->
    <div class="stat-col">
      <div class="col-header">BY THE NUMBERS</div>

      <div style="margin-top: 16px;">
        <div class="stat-item">
          <span class="stat-num">65<span style="font-size:36px;opacity:0.6">+</span></span>
          <span class="stat-label">Total Skills</span>
        </div>

        <div class="stat-item">
          <span class="stat-num">9</span>
          <span class="stat-label">Categories</span>
        </div>

        <div class="stat-item">
          <span class="stat-num">16</span>
          <span class="stat-label" style="color: #4ADE80;">New · Apr 2026</span>
        </div>
      </div>
    </div>

    <!-- Right editorial block -->
    <div class="editorial">

      <!-- Meta row -->
      <div class="meta-row">
        <span class="meta-badge">Reference v2</span>
        <span class="meta-dot"></span>
        <span class="meta-text">Claude Code</span>
        <span class="meta-dot"></span>
        <span class="meta-text">April 2026</span>
      </div>

      <!-- Headline -->
      <div class="headline-block">
        <div class="headline-pre">Agents &amp; Skills</div>
        <div class="headline-main">The Complete<br><em>Reference</em></div>
        <div class="headline-sub">Guide</div>
        <div class="tagline">
          Every Claude Code skill, sub-agent &amp; slash command —<br>
          <strong>organized, searchable, downloadable.</strong>
        </div>
      </div>

      <!-- Bottom row -->
      <div class="bottom-row">
        <div class="author-block">
          <div class="author-avatar">NB</div>
          <div class="author-info">
            <div class="author-name">Neeraj Bansal</div>
            <div class="author-url">neeraj-bansal.com</div>
          </div>
        </div>

        <div class="cta-pill">
          <span class="cta-text">Free · Bookmark it</span>
          <span class="cta-arrow">→</span>
        </div>
      </div>

    </div>

  </div>
</body>
</html>
